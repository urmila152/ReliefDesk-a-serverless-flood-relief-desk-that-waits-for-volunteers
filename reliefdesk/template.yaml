AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ReliefDesk - serverless disaster relief request coordination (prototype)

Parameters:
  CoordinatorKey:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Shared password for the coordinator dashboard
  BedrockModelId:
    Type: String
    Default: ""
    Description: Bedrock model or inference profile ID for extraction. Empty = keyword rules only.
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional. Volunteers also see offers on their volunteer page without it.
  OfferTimeoutSeconds:
    Type: Number
    Default: 600
  CompletionTimeoutSeconds:
    Type: Number
    Default: 2700

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Timeout: 20
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        REQUESTS_TABLE: !Ref RequestsTable
        VOLUNTEERS_TABLE: !Ref VolunteersTable
        OFFERS_TABLE: !Ref OffersTable
        COORDINATOR_KEY: !Ref CoordinatorKey
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        OFFER_TIMEOUT: !Ref OfferTimeoutSeconds
        SITE_URL: !Sub https://${SiteDistribution.DomainName}

Resources:
  # ---------- Data ----------
  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: request_id, AttributeType: S}
        - {AttributeName: cell, AttributeType: S}
        - {AttributeName: created_at, AttributeType: N}
      KeySchema:
        - {AttributeName: request_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: cell-index
          KeySchema:
            - {AttributeName: cell, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  VolunteersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: volunteer_id, AttributeType: S}
      KeySchema:
        - {AttributeName: volunteer_id, KeyType: HASH}

  OffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: offer_id, AttributeType: S}
        - {AttributeName: volunteer_id, AttributeType: S}
      KeySchema:
        - {AttributeName: offer_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: volunteer-index
          KeySchema:
            - {AttributeName: volunteer_id, KeyType: HASH}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # ---------- Compute ----------
  ExtractFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: extract.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RequestsTable}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'   # prototype: model/profile ARNs differ per region

  StepFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: steps.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RequestsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref VolunteersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref OffersTable}

  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ReliefStateMachine
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RequestsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref VolunteersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref OffersTable}
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ReliefStateMachine
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: '*'
            - Effect: Allow
              Action: [states:GetExecutionHistory, states:DescribeExecution]
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:*:*
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-coordinator-key]
        AllowMethods: [GET, POST, OPTIONS]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50   # also protects your credits

  # ---------- Orchestration ----------
  ReliefStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/relief.asl.json
      DefinitionSubstitutions:
        ExtractFnArn: !GetAtt ExtractFn.Arn
        StepFnArn: !GetAtt StepFn.Arn
        OfferTimeout: !Ref OfferTimeoutSeconds
        CompletionTimeout: !Ref CompletionTimeoutSeconds
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref ExtractFn}
        - LambdaInvokePolicy: {FunctionName: !Ref StepFn}

  # ---------- Static site (HTTPS via CloudFront so browser geolocation works) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt SiteOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled: no invalidations while iterating

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${SiteDistribution.DomainName}
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  SiteBucketName:
    Value: !Ref SiteBucket
  RequestsTableName:
    Value: !Ref RequestsTable
  VolunteersTableName:
    Value: !Ref VolunteersTable
  OffersTableName:
    Value: !Ref OffersTable
  StateMachineArn:
    Value: !Ref ReliefStateMachine
